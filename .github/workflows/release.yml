name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  github-release:
    name: Build GitHub release artifact
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Run release checks
        run: python tools/release_check.py

      - name: Create or update GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_NAME: ${{ github.ref_name }}
        run: |
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release upload "$TAG_NAME" dist/*.ankiaddon dist/SHA256SUMS.txt dist/release.json --clobber
          else
            gh release create "$TAG_NAME" dist/*.ankiaddon dist/SHA256SUMS.txt dist/release.json --generate-notes --title "$TAG_NAME"
          fi
