name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: Validate and build add-on
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate add-on
        run: python tools/validate_addon.py

      - name: Build package
        run: python tools/build_ankiaddon.py

      - name: Upload package artifact
        uses: actions/upload-artifact@v7
        with:
          name: anki-addon-package
          path: dist/*.ankiaddon
